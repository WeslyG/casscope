global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - casscope-alerts.yml

scrape_configs:
  - job_name: casscope
    metrics_path: /metrics
    static_configs:
      # Replace with exporter addresses reachable from this Prometheus process.
      - targets: ['127.0.0.1:9505']
