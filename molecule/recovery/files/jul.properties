handlers=java.util.logging.FileHandler
.level=OFF
java.util.logging.FileHandler.pattern=/opt/cassandra/logs/jmx-calls.log
java.util.logging.FileHandler.limit=20000000
java.util.logging.FileHandler.count=3
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tFT%1$tT.%1$tL%1$tz %2$s %4$s %5$s%6$s%n
javax.management.remote.rmi.level=OFF
